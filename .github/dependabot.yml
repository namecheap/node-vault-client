version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Matches the history: runtime bumps land as `fix(deps)` because they ship to
    # consumers, tooling as `chore(deps)`.
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      # One PR per week for the routine tooling churn, rather than one per package.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Not a Node-version hold (Node 18 support was dropped — see #185 and the
      # 3.0.0 release notes): config 5.x is a ground-up ESM rewrite
      # ("node-config is now an ESM module"), which this CommonJS codebase's
      # synchronous `require('config')` in VaultNodeConfig's constructor cannot
      # adopt without its own dedicated compatibility work. Peer range is
      # deliberately <5 until that's done.
      - dependency-name: config
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Actions are CI-only, so they must not cut a release.
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
