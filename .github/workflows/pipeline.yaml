name: Node.js CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# One in-flight run per branch/PR. New pushes (e.g. rebases) cancel the
# superseded run, except on master where every commit is kept.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Gate on high/critical only: moderate advisories are usually in dev/transitive
        # tooling (mocha/eslint/sinon) and would block release CI with noise unrelated to
        # the shipped runtime (deps: @aws-sdk/credential-providers, aws4, long-timeout).
        # Snyk and CodeQL run as additional, broader security gates on every PR.
        run: npm audit --audit-level=high

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm install config

      - name: Run coverage
        # `npm run coverage` enforces the c8 thresholds in package.json (check-coverage),
        # so a coverage regression below the pinned floor fails this job.
        run: npm run coverage

      - name: Upload coverage report
        # Upload even when the threshold gate fails, so the HTML/lcov report is available
        # to diagnose which file regressed.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm install config

      - name: Run unit tests
        run: npm run test:unit

  # Full integration suite — exercises the client against a real Vault
  # instance started via docker-compose.
  e2e:
    runs-on: ubuntu-latest
    name: e2e (node ${{ matrix.node-version }}, vault ${{ matrix.vault-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
        # Latest 1.x. Minor-line tags, not patch pins: `1.21` follows the newest
        # 1.21.x, so patch releases are covered without touching this file. Keep
        # in step with the default in docker-compose.yml so a local
        # `docker compose up` reproduces what CI runs.
        vault-version: ['1.21']
        include:
          # Latest 2.x, on one Node version rather than crossed with the whole
          # matrix: the node-version axis exercises the client's runtime and the
          # vault-version axis the server's API, and the two have never
          # interacted. Node 20 is the version in .nvmrc.
          - node-version: 20
            vault-version: '2.0'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Start Vault ${{ matrix.vault-version }} (docker compose)
        env:
          VAULT_IMAGE: hashicorp/vault:${{ matrix.vault-version }}
        run: docker compose up -d --wait

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci && npm install config

      - name: Run e2e tests
        run: npm run test:e2e

      # Runs across the whole node x vault matrix like the rest of this job.
      - name: Run JWT e2e tests
        run: npm run test:e2e:jwt

  # KV v2 integration suite — exercises mount auto-detection, data/metadata path
  # rewriting, merge-patch update, version ops and metadata ops against a real
  # KV v2 Vault (the vault-server-kv2 compose service). A single Node version is
  # enough: the KV v2 code paths have no Node-version-specific behavior, and the
  # matrix above already covers runtime compatibility.
  e2e-kv2:
    runs-on: ubuntu-latest
    name: e2e-kv2 (vault ${{ matrix.vault-version }})
    strategy:
      fail-fast: false
      matrix:
        # Both supported Vault lines. The KV v2 surface — data/metadata paths,
        # merge-patch, version and metadata operations — is where a server-side
        # API change would show first, so this suite gets the full Vault axis
        # even though it stays on one Node version.
        vault-version: ['1.21', '2.0']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Start Vault ${{ matrix.vault-version }} (docker compose)
        env:
          VAULT_IMAGE: hashicorp/vault:${{ matrix.vault-version }}
        run: docker compose up -d --wait

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run KV v2 e2e tests
        run: npm run test:e2e:kv2

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Use Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Packs the repo, installs the tarball into a throwaway project and requires it, so a
      # `files` omission fails here instead of reaching npm.
      - name: Verify the packed artifact
        run: node test/verify-package.mjs

  # Single aggregate gate, so branch protection needs one context instead of matrix-derived
  # names that change whenever the Node or Vault matrix changes (see issue #168).
  ci-ok:
    if: always()
    needs: [audit, lint, coverage, test, e2e, e2e-kv2, package]
    runs-on: ubuntu-latest
    steps:
      - name: Report job results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: printf '%s\n' "$RESULTS"

      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::one or more pipeline jobs did not succeed"
          exit 1

