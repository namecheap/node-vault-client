name: Publish to npm (legacy)
on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# A GitHub Release runs the workflow file of the tagged commit, so a release tagged on the 1.0.x
# line runs this file, not master's. It publishes under the `legacy` dist-tag so `latest` stays on
# the current major.
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1
      - name: Ensure recent npm
        run: npm install -g npm@latest

      - name: Check the tag, version line and CHANGELOG
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version $VERSION."
            exit 1
          fi
          case "$VERSION" in
            1.*) ;;
            *) echo "::error::This workflow publishes the 1.x line under the legacy dist-tag; got $VERSION."; exit 1 ;;
          esac
          if ! grep -Eq "^# ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No release-notes heading for version ${VERSION}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci && npm install --no-save 'config@<4'

      # The e2e suite needs a Vault server; the pipeline workflow runs it on every PR.
      - name: Run unit tests
        run: npx mocha $(ls test/*.test.js | grep -v '/e2e\.test\.js$')

      - name: Publish
        run: npm publish --provenance --access public --tag legacy
