name: Publish to npm
on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1. Node 24 bundles npm 11.x, so the
      # job uses that rather than installing `npm@latest`: an unreviewed npm release would run
      # here with id-token: write (#229). This fails the job if the bundled npm is too old.
      - name: Check npm supports trusted publishing
        run: |
          node -e '
            const v = process.argv[1].split(".").map(Number);
            const min = [11, 5, 1];
            const cmp = v[0] - min[0] || v[1] - min[1] || v[2] - min[2];
            if (cmp < 0) {
              console.error(`::error::npm ${process.argv[1]} is older than 11.5.1, which trusted publishing needs`);
              process.exit(1);
            }
          ' "$(npm --version)"

      # No dependency lifecycle scripts while the OIDC credential is in scope (#229). None of
      # the locked packages has one today; this keeps it that way for future versions.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Release-time guard (issue #111): publishing x.y.z requires a matching "# x.y.z ..."
      # release-notes heading in CHANGELOG.md, so the changelog cannot silently fall out of
      # date. Keeping the check here (instead of on every PR) avoids blocking non-user-facing
      # PRs while still enforcing the CONTRIBUTING.md convention where it matters.
      - name: Check CHANGELOG.md covers this release
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! grep -Eq "^# ${VERSION//./\\.}( |$)" CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::No release-notes heading for version ${VERSION}. Move the '# Unreleased' notes into a '# ${VERSION} Release notes (YYYY-MM-DD)' section before publishing."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify the packed artifact
        run: node test/verify-package.mjs

      - name: Publish
        run: npm publish --provenance --access public
